<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · Удалёнка</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f5f9;
            --surface: #ffffff;
            --border: #e6e8ee;
            --text: #1c2130;
            --text-muted: #6b7280;
            --text-faint: #9aa1ac;
            --brand: #4f6ef7;
            --brand-dark: #3c56d6;
            --brand-soft: #eef1ff;
            --danger: #e5484d;
            --danger-soft: #fdeaea;
            --danger-text: #b42318;
            --radius-lg: 16px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .08);
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-wrap { width: 100%; max-width: 380px; }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 22px;
            font-weight: 800;
            font-size: 19px;
        }
        .login-brand .mark {
            width: 38px; height: 38px; border-radius: 11px;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; box-shadow: var(--shadow);
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 28px 26px;
        }
        .login-card h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
        .login-card .sub { color: var(--text-muted); font-size: 13.5px; margin: 0 0 20px; }
        .form-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
        .form-control {
            border-radius: var(--radius-sm);
            border-color: var(--border);
            padding: 10px 12px;
            font-size: 14.5px;
        }
        .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
        .btn-primary {
            background: var(--brand); border: none; border-radius: var(--radius-sm);
            font-weight: 600; padding: 10px 16px;
        }
        .btn-primary:hover, .btn-primary:focus { background: var(--brand-dark); }
        .alert-danger {
            background: var(--danger-soft); color: var(--danger-text);
            border: none; border-radius: var(--radius-sm); font-size: 13.5px; padding: 10px 14px;
        }
        .login-footnote { text-align: center; color: var(--text-faint); font-size: 12.5px; margin-top: 16px; }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-brand">
        <span class="mark">🏠</span>
        Удалёнка <span style="font-weight: 500; color: var(--text-faint);">HR-портал</span>
    </div>

    <div class="login-card">
        <h1>Вход в систему</h1>
        <p class="sub">Введите свои корпоративные email и пароль.</p>

        {% if error == "invalid" %}
        <div class="alert alert-danger mb-3">⚠️ Неверный email или пароль.</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="you@company.ru" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Войти</button>
        </form>
    </div>

    <p class="login-footnote">Забыли пароль — обратитесь к администратору, он сможет выдать новый.</p>
</div>

</body>
</html>
