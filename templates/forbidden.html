{% extends "base.html" %}
{% block title %}Доступ запрещён · Удалёнка{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="card mx-auto mt-4" style="max-width: 480px;">
        <div class="card-body text-center py-5">
            <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
            <h5 class="mb-2">Доступ запрещён</h5>
            <p class="text-muted mb-4">{{ message }}</p>
            {% if current_user %}
            <a href="/dashboard/{{ current_user.id }}" class="btn btn-primary">Перейти в мой кабинет</a>
            {% else %}
            <a href="/login" class="btn btn-primary">Войти в систему</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
